:root, [data-theme="dark"] {
  --bg-primary: #0f172a;

  --bg-tertiary: #0b1120;
  --card-bg: #1e293b;

  --text-primary: #ffffff;
  --text-secondary: #94a3b8;

  --accent-purple: #a855f7;
  --accent-yellow: #fde047;
  --accent-pink: #f43f5e;
  --shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
}
[data-theme="light"] {
  --bg-primary: #f8fafc;
  --bg-secondary: #ffffff;
  --bg-tertiary: #f1f5f9;
  --card-bg: #ffffff;
  --border-color: #cbd5e1;
  --text-primary: #0f172a;
  --text-secondary: #64748b;

* { box-sizing: border-box; }
body {

/* ═════════════════════════════════════════════════════════════════
   ANIMACIONES BASE (PRÓXIMOS Y ANIVERSARIOS)
   ═════════════════════════════════════════════════════════════════ */
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

.pulse-future-block { position: relative; overflow: hidden; }
.pulse-future-block::before {
  content: ""; position: absolute; top: 20px; left: 20px;
  width: 10px; height: 10px; border-radius: 50%;
  background: rgba(8, 145, 178, 0.4);
  animation: wave-radial-expand 2.5s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
  pointer-events: none; z-index: 1;
}
@keyframes wave-radial-expand {
  0% { transform: scale(0); opacity: 0.9; box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.8); }
  50% { opacity: 0.5; }
  100% { transform: scale(85); opacity: 0; box-shadow: 0 0 40px 20px rgba(8, 145, 178, 0); }
}
.radar-dot {
  display: inline-block; width: 8px; height: 8px; background-color: #38bdf8;
  border-radius: 50%; margin-right: 6px; animation: spin-glow 1.5s infinite alternate;
}
@keyframes spin-glow {
  0% { opacity: 0.3; transform: scale(0.8); }
  100% { opacity: 1; transform: scale(1.3); }
}

.snow-anniversary-block { position: relative; overflow: hidden; }
@keyframes snow-fall-realistic-1 {
  0% { transform: translateY(-10px) translateX(0) rotate(0deg); opacity: 0; }
  10% { opacity: 0.9; }
  50% { transform: translateY(50vh) translateX(25px) rotate(180deg); }
  90% { opacity: 0.8; }
  100% { transform: translateY(105%) translateX(-15px) rotate(360deg); opacity: 0; }
}
@keyframes snow-fall-realistic-2 {
  0% { transform: translateY(-10px) translateX(0) rotate(0deg); opacity: 0; }
  15% { opacity: 0.85; }
  60% { transform: translateY(60vh) translateX(-30px) rotate(-180deg); }
  100% { transform: translateY(105%) translateX(20px) rotate(-360deg); opacity: 0; }
}
.snow-anniversary-block::before, .snow-anniversary-block::after {
  content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none; z-index: 2;
}
.snow-anniversary-block::before {
  background-image:
    radial-gradient(circle, #f43f5e 3px, transparent 3.5px),
    radial-gradient(circle, #38bdf8 2px, transparent 2.5px),
    radial-gradient(circle, #a855f7 4px, transparent 4.5px),
    radial-gradient(circle, #fde047 2px, transparent 2.5px),
    radial-gradient(circle, #10b981 3px, transparent 3.5px),
    radial-gradient(circle, #ec4899 2px, transparent 2.5px);
  background-size: 120px 300px, 180px 250px, 220px 350px, 150px 280px, 200px 320px, 160px 270px;
  background-position: 10% -20px, 28% -50px, 45% -10px, 62% -40px, 75% -15px, 88% -60px;
  animation: snow-fall-realistic-1 9s linear infinite;
}
.snow-anniversary-block::after {
  background-image:
    radial-gradient(circle, #06b6d4 3px, transparent 3.5px),
    radial-gradient(circle, #eab308 2px, transparent 2.5px),
    radial-gradient(circle, #8b5cf6 3px, transparent 3.5px),
    radial-gradient(circle, #f472b6 4px, transparent 4.5px);
  background-size: 140px 310px, 210px 260px, 170px 340px, 230px 290px;
  background-position: 5% -35px, 20% -15px, 52% -45px, 68% -20px;
  animation: snow-fall-realistic-2 12s linear infinite;
  animation-delay: 4.5s;
}

/* ═════════════════════════════════════════════════════════════════
   BARRA SUPERIOR
   ═════════════════════════════════════════════════════════════════ */
.top-controls {
  position: fixed; top: 12px; right: 12px; z-index: 9999;
  display: flex; gap: 8px;
}
.ctrl-btn {
  background: var(--card-bg); color: var(--text-primary);
  border: 1px solid var(--border-color); border-radius: 10px;
  padding: 8px 12px; cursor: pointer; font-weight: 700;
  display: inline-flex; align-items: center; gap: 6px;
  transition: all 0.2s; box-shadow: var(--shadow);
}
.ctrl-btn:hover { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }

/* ═════════════════════════════════════════════════════════════════
   BARRA DE FILTROS
   ═════════════════════════════════════════════════════════════════ */
.filter-controls {
  max-width: 1200px; margin: 20px auto; padding: 18px;
  background: var(--card-bg); border: 1px solid var(--border-color);
  border-radius: 14px; box-shadow: var(--shadow);
}
.filter-row { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; margin-bottom: 14px; }
.filter-group { display: flex; align-items: center; gap: 8px; }
.filter-label {
  font-size: 12px; font-weight: 800; text-transform: uppercase;
  color: var(--accent-yellow); letter-spacing: 0.5px;
}
.filter-select {
  background: var(--bg-tertiary); color: var(--text-primary);
  border: 1px solid var(--border-color); border-radius: 8px;
  padding: 8px 12px; font-weight: 600; cursor: pointer; outline: none;
}
.view-toggle { display: inline-flex; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
.view-btn {
  background: var(--bg-tertiary); color: var(--text-primary); border: 0;
  padding: 8px 14px; cursor: pointer; transition: all 0.2s;
}
.view-btn.active { background: var(--accent-blue); color: #fff; }

.switch { position: relative; display: inline-block; width: 46px; height: 24px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute; cursor: pointer; inset: 0;
  background: var(--border-color); border-radius: 34px; transition: .3s;
}
.slider:before {
  content: ""; position: absolute; height: 18px; width: 18px;
  left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: .3s;
}
input:checked + .slider { background: var(--accent-blue); }
input:checked + .slider:before { transform: translateX(22px); }

.chips-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.chip {
  background: var(--bg-tertiary); color: var(--text-primary);
  border: 1px solid var(--border-color); border-radius: 20px;
  padding: 6px 14px; font-size: 12px; font-weight: 700; cursor: pointer;
  transition: all 0.2s;
}
.chip:hover { border-color: var(--accent-blue); }
.chip.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }

/* ═════════════════════════════════════════════════════════════════
   MODALES
   ═════════════════════════════════════════════════════════════════ */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(6px); z-index: 10000;
  display: flex; align-items: center; justify-content: center;
  padding: 16px; opacity: 0; pointer-events: none;
  transition: opacity 0.25s ease;
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal-content {
  background: var(--bg-secondary); color: var(--text-primary);
  border: 1px solid var(--accent-blue); border-radius: 18px;
  width: 100%; max-width: 720px; max-height: 92vh;
  display: flex; flex-direction: column;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
  position: relative; transform: scale(0.95);
  transition: transform 0.25s ease;
}
.modal-overlay.open .modal-content { transform: scale(1); }
.modal-close {
  position: absolute; top: 12px; right: 12px;
  background: var(--accent-pink); color: #fff; border: 0;
  width: 38px; height: 38px; border-radius: 50%;
  cursor: pointer; font-size: 16px; z-index: 5;
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { opacity: 0.85; }

.karaoke-header { padding: 20px 60px 12px 20px; border-bottom: 1px solid var(--border-color); }
.modal-title { margin: 0; font-size: 20px; font-weight: 800; }
.modal-subtitle { margin: 4px 0 0 0; color: var(--accent-blue); font-weight: 600; font-size: 14px; }
.karaoke-lyrics {
  flex: 1; overflow-y: auto; padding: 30px 20px;
  scroll-behavior: smooth; max-height: 55vh;
  display: flex; flex-direction: column; gap: 8px;
}
.lyric-line {
  padding: 10px 14px; border-radius: 10px;
  font-size: 18px; font-weight: 600; line-height: 1.4;
  color: var(--text-secondary); cursor: pointer;
  transition: all 0.3s ease; border-left: 3px solid transparent;
}
.lyric-line:hover { background: var(--bg-tertiary); color: var(--text-primary); }
.lyric-line.active {
  color: #fff;
  background: linear-gradient(90deg, var(--accent-purple), var(--accent-blue));
  border-left-color: var(--accent-yellow);
  box-shadow: 0 0 20px rgba(168, 85, 247, 0.6), 0 0 40px rgba(56, 189, 248, 0.4);
  transform: scale(1.02);
  text-shadow: 0 0 12px rgba(255, 255, 255, 0.7);
}
.karaoke-empty { text-align: center; color: var(--text-secondary); font-style: italic; padding: 40px 20px; }
.karaoke-controls {
  display: flex; align-items: center; justify-content: center; gap: 16px;
  padding: 12px; border-top: 1px solid var(--border-color);
}
.ctrl-btn-round {
  background: var(--accent-blue); color: #fff; border: 0;
  width: 44px; height: 44px; border-radius: 50%;
  cursor: pointer; font-size: 16px; transition: transform 0.2s;
}
.ctrl-btn-round:hover { transform: scale(1.1); }
.karaoke-time { font-family: monospace; font-weight: 700; color: var(--text-secondary); }

/* Smartlink */
.smartlink-content { padding: 30px 24px; text-align: center; max-width: 460px; }
.sl-cover {
  width: 180px; height: 180px; border-radius: 16px;
  object-fit: cover; margin: 0 auto 16px; display: block;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
}
.sl-title { font-size: 22px; font-weight: 800; margin: 0 0 4px 0; }
.sl-artist { font-size: 15px; color: var(--accent-blue); font-weight: 700; margin: 0 0 20px 0; }
.sl-links { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.sl-link {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  padding: 14px; border-radius: 12px; background: var(--bg-tertiary);
  color: var(--text-primary); text-decoration: none; font-weight: 700;
  border: 1px solid var(--border-color); transition: all 0.2s;
}
.sl-link:hover { background: var(--accent-blue); color: #fff; transform: translateY(-2px); }
.sl-copy {
  margin-top: 16px; background: var(--accent-purple); color: #fff;
  border: 0; padding: 12px 20px; border-radius: 10px;
  font-weight: 700; cursor: pointer; width: 100%; font-size: 14px;
}

/* Countdown */
.countdown-box {
  display: flex; gap: 10px; justify-content: center; margin: 10px 0;
  font-family: monospace; flex-wrap: wrap;
}
.countdown-seg {
  background: var(--bg-tertiary); border: 1px solid var(--accent-blue);
  border-radius: 8px; padding: 8px 12px; min-width: 55px; text-align: center;
}
.countdown-num { display: block; font-size: 22px; font-weight: 900; color: var(--accent-yellow); }
.countdown-lbl { font-size: 10px; color: var(--text-secondary); text-transform: uppercase; }

/* Grid view */
#catalog-container.grid-view .release-card {
  display: inline-block; width: calc(33.333% - 14px);
  margin: 6px; vertical-align: top; min-width: 260px;
}
#catalog-container.grid-view .artist-details { margin-bottom: 14px; }
@media (max-width: 900px) { #catalog-container.grid-view .release-card { width: calc(50% - 14px); } }
@media (max-width: 600px) { #catalog-container.grid-view .release-card { width: 100%; margin: 6px 0; } }

.release-card.is-explicit.hidden-explicit { display: none !important; }
.release-card { transition: outline 0.3s ease; }

.release-actions {
  position: absolute; top: 12px; right: 12px;
  display: flex; gap: 6px; z-index: 6;
}
.act-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--bg-tertiary); color: var(--text-primary);
  border: 1px solid var(--accent-blue); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.act-btn:hover { background: var(--accent-blue); color: #fff; transform: scale(1.1); }
.act-btn.mic { border-color: var(--accent-purple); }
.act-btn.mic:hover { background: var(--accent-purple); }
.act-btn.track-mic { width: 30px; height: 30px; font-size: 12px; }

/* Badges de contenido */
.explicit-badge {
  display: inline-block; background: #000; color: #fff;
  font-size: 10px; font-weight: 900; padding: 2px 6px;
  border-radius: 3px; margin-left: 8px; vertical-align: middle;
}
.clean-badge {
  display: inline-block; background: #10b981; color: #fff;
  font-size: 10px; font-weight: 900; padding: 2px 6px;
  border-radius: 3px; margin-left: 8px; vertical-align: middle;
}
.nonexplicit-badge {
  display: inline-block; background: #64748b; color: #fff;
  font-size: 10px; font-weight: 900; padding: 2px 6px;
  border-radius: 3px; margin-left: 8px; vertical-align: middle;
}

/* Plataformas */
.platform-btn-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; background: var(--card-bg); color: var(--text-primary);
  margin: 4px; border-radius: 10px; text-decoration: none;
  font-size: 20px; border: 1px solid var(--accent-blue);
  box-shadow: var(--shadow); transition: all 0.2s ease-in-out;
}
.platform-btn-icon:hover {
  background: #2563eb; color: #fff;
  transform: translateY(-3px) scale(1.05);
  box-shadow: 0 6px 15px rgba(37, 99, 235, 0.5);
}
.embed-wrapper iframe { width: 100% !important; border-radius: 12px; border: 0; }

.custom-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
.custom-scroll::-webkit-scrollbar-track { background: var(--bg-tertiary); border-radius: 10px; }
.custom-scroll::-webkit-scrollbar-thumb { background: var(--accent-blue); border-radius: 10px; }

.quick-event-card { transition: all 0.2s ease; cursor: pointer; }
.quick-event-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5); }

/* Media queries */
@media (max-width: 600px) {
  .artist-summary-title { font-size: 16px !important; }
  .artist-summary-badge { font-size: 11px !important; padding: 4px 8px !important; }
  .track-meta-box { font-size: 12px !important; padding: 4px 8px !important; }
  .top-controls { top: 8px; right: 8px; }
  .ctrl-btn { padding: 6px 10px; font-size: 12px; }
}
</style>

/* ═════════════════════════════════════════════════════════════════
   3. UTILIDADES
   ═════════════════════════════════════════════════════════════════ */
function escapeHtml(text) {
  if (text === null || text === undefined) return '';
  return String(text)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function getYouTubeVideoId(url) {
  if (!url) return null;
  const m = String(url).match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}

function getPlatformIcon(platform) {
  const icons = {
    "Spotify": "fa-brands fa-spotify",
    "YouTube": "fa-brands fa-youtube",
    "Apple Music": "fa-brands fa-apple",
    "Amazon Music": "fa-brands fa-amazon",
    "Deezer": "fa-brands fa-deezer",
    "Tidal": "fa-solid fa-compact-disc",
    "Instagram": "fa-brands fa-instagram",
    "TikTok": "fa-brands fa-tiktok",
    "SoundCloud": "fa-brands fa-soundcloud"
  };
  return icons[platform] || "fa-solid fa-link";
}

/* Normaliza "Explicit Content" a: 'explicit' | 'clean' | 'nonexplicit' | 'unknown' */
function normalizeExplicit(value) {
  if (!value) return "unknown";
  const v = String(value).toLowerCase().trim();
  if (v.includes("limpia") || v.includes("clean")) return "clean";
  if (v.includes("no expl") || v.includes("not expl") || v === "no" || v === "false") return "nonexplicit";
  if (v.includes("expl") || v === "sí" || v === "si" || v === "yes" || v === "true") return "explicit";
  return "unknown";
}

function explicitBadgeHTML(type) {
  if (type === "explicit") return `<span class="explicit-badge" title="Explícito">E</span>`;
  if (type === "clean") return `<span class="clean-badge" title="Versión Limpia">L</span>`;
  if (type === "nonexplicit") return `<span class="nonexplicit-badge" title="No Explícito">NE</span>`;
  return "";
}

/* ═════════════════════════════════════════════════════════════════
   4. LRC PARSER
   ═════════════════════════════════════════════════════════════════ */
function parseLRC(lrcText) {
  if (!lrcText) return [];
  const lines = String(lrcText).split(/\r?\n/);
  const result = [];
  const timeTagRe = /\[(\d{1,2}):(\d{2})(?:\.(\d{1,3}))?\]/g;
  lines.forEach(line => {
    const tags = [...line.matchAll(timeTagRe)];
    if (tags.length === 0) return;
    const text = line.replace(timeTagRe, "").trim();
    tags.forEach(tag => {
      const min = parseInt(tag[1], 10);
      const sec = parseInt(tag[2], 10);
      const frac = tag[3] ? parseInt(tag[3].padEnd(3, "0"), 10) / 1000 : 0;
      result.push({ time: min * 60 + sec + frac, text });
    });
  });
  return result.sort((a, b) => a.time - b.time);
}

/* ═════════════════════════════════════════════════════════════════
   6. ESTADO DE LANZAMIENTO
   ═════════════════════════════════════════════════════════════════ */
function checkReleaseStatus(song) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const rawDate = song["Fecha de inicio de ventas"] || song["Lanzamiento original"] || song["Fecha de pedido anticipado"] || "";
  if (!rawDate) return { type: null };

  const relDate = new Date(rawDate);
  if (isNaN(relDate.getTime())) return { type: null };

  const relDateZero = new Date(relDate.getFullYear(), relDate.getMonth(), relDate.getDate());
  const formattedDate = relDate.toLocaleDateString(currentLang === "es" ? "es-ES" : "en-US");

  if (relDateZero > today) {
    const diffDays = Math.ceil((relDateZero - today) / 86400000);
    return {
      type: "FUTURE",
      label: t("next_release"),
      detail: diffDays === 1 ? t("tomorrow") : t("days_left", { n: diffDays }),
      badgeColor: "#0891b2",
      bgColor: "rgba(6, 182, 212, 0.15)",
      borderColor: "#0891b2",
      dateStr: formattedDate,
      animClass: "pulse-future-block",
      targetTime: relDate.getTime()
    };
  }

  const isSameMonth = relDate.getMonth() === today.getMonth();
  const isSameDay = relDate.getDate() === today.getDate();
  if (isSameMonth && isSameDay && relDate.getFullYear() < today.getFullYear()) {
    const years = today.getFullYear() - relDate.getFullYear();
    return {
      type: "ANNIVERSARY",
      label: t("anniv_today"),
      detail: t("years_today", { n: years }),
      badgeColor: "#d97706",
      bgColor: "rgba(245, 158, 11, 0.15)",
      borderColor: "#d97706",
      dateStr: formattedDate,
      animClass: "snow-anniversary-block"
    };
  }
  return { type: null };
}

}

function buildCatalog() {
  const container = document.getElementById("catalog-container");
  const eventsList = document.getElementById("events-summary-list");
  const eventsContainer = document.getElementById("events-summary-container");

  const forbiddenFields = [
    "Grouvex Studios UserID","Marca temporal","Estado del Contrato","Razón",
    "¿Se Puede Modificar el Lanzamiento?"
  ];

  const defaultFields = [
    "Artista","Título del álbum/sencillo/EP","Idioma del álbum","Versión del Lanzamiento","Cover?",
    "Álbum Recopilatorio","Otros Artistas Álbum","Compositores del álbum","Letristas del álbum",
    "Información para colaboradores","Género primario","Género secundario","Derechos de autor de la composición",
    "Derechos de autor de grabación de sonido","Nombre del sello discográfico","Lanzamiento original",
    "Fecha de pedido anticipado","Fecha de inicio de ventas","Agregar una hora","Elegir zona horaria | Agregar una hora",
    "Entrar en vivo | Agregar una hora","Explicit Content","Plataformas de Lanzamiento","Spotify","Spotify Embed",
    "YouTube","YouTube Embed","Apple Music","Apple Music Embed","Amazon Music","Amazon Music Embed",
    "Deezer","Deezer Embed","Tidal","Instagram","TikTok","SoundCloud","Territorios donde:","Territorios:",
    "Likes","Categoría del Lanzamiento","Tipo"
  ];
  for (let i = 1; i <= 15; i++) {
    defaultFields.push(
      "Título " + i,"Artistas " + i,"Compositores " + i,"¿Contiene letras? " + i,
      "Letristas " + i,"Idioma " + i,"Preview Clip " + i,"Cover " + i
    );
  }

  const embedKeys = ["Spotify Embed","YouTube Embed","Apple Music Embed","Amazon Music Embed","Deezer Embed"];
  const linkKeys = ["Spotify","YouTube","Apple Music","Amazon Music","Deezer","Tidal","Instagram","TikTok","SoundCloud","Push"];

  const artistsMap = {};
  const globalEvents = [];
  let counter = 0;
  const genreSet = new Set();

  AppState.songsData.forEach(song => {
    const priv = (song["Mostrar Privacidad"] || song["Privacidad"] || "").toString().trim();
    if (priv.toLowerCase() === "privado" || priv === "") return;

    let allowed;
    if (priv.toLowerCase() === "público" || priv.toLowerCase() === "publico") {
      allowed = [...defaultFields];
    } else {
      allowed = priv.split(",").map(s => s.trim());
    }
    allowed = allowed.filter(f => !forbiddenFields.includes(f));

    const artista = song["Artista"] || "Artista Desconocido";
    if (!artistsMap[artista]) artistsMap[artista] = [];

    counter++;
    const cardId = "release-card-" + counter;
    const status = checkReleaseStatus(song);
    const explicitType = normalizeExplicit(song["Explicit Content"]);

    if (song["Género primario"]) genreSet.add(song["Género primario"]);
    if (song["Género secundario"]) genreSet.add(song["Género secundario"]);

    if (status.type) {
      globalEvents.push({
        artist: artista,
        title: song["Título del álbum/sencillo/EP"] || "Lanzamiento",
        status, targetId: cardId
      });
    }

    artistsMap[artista].push({
      data: song, allowed, cardId, status, explicitType,
      genre: `${song["Género primario"] || ""}|${song["Género secundario"] || ""}`,
      category: (song["Categoría del Lanzamiento"] || song["Tipo"] || "").toLowerCase(),
      date: new Date(song["Lanzamiento original"] || song["Fecha de inicio de ventas"] || 0).getTime() || 0
    });
  });

  AppState.artistsMap = artistsMap;

  // Géneros dinámicos
  const genreRow = document.getElementById("chips-genre");
  if (genreRow) {
    genreRow.querySelectorAll(".chip[data-filter-genre]:not([data-filter-genre='all'])").forEach(c => c.remove());
    [...genreSet].sort().forEach(g => {
      const btn = document.createElement("button");
      btn.className = "chip";
      btn.dataset.filterGenre = g;
      btn.textContent = g;
      genreRow.appendChild(btn);
    });
  }

  // Eventos destacados
  eventsList.innerHTML = "";
  if (globalEvents.length > 0) {
    globalEvents.forEach(item => {
      const card = document.createElement("div");
      card.className = "quick-event-card";
      card.onclick = () => scrollToRelease(item.artist, item.targetId);
      card.style.cssText = `flex: 0 0 260px; background: var(--card-bg); border-left: 4px solid ${item.status.badgeColor}; border-radius: 8px; padding: 10px 12px;`;
      const icon = item.status.type === "ANNIVERSARY" ? "fa-cake-candles" : "fa-rocket";
      const prefixVisual = item.status.type === "FUTURE" ? '<span class="radar-dot"></span>' : '';
      card.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
          <span style="font-size: 10px; font-weight: 800; color: #fff; background: ${item.status.badgeColor}; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; display: inline-flex; align-items: center;">
            ${prefixVisual}<i class="fa-solid ${icon}" style="margin-right: 4px;"></i>${escapeHtml(item.status.label)}
          </span>
        </div>
        <div style="font-size: 14px; font-weight: 800; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${escapeHtml(item.title)}</div>
        <div style="font-size: 12px; color: var(--accent-blue); font-weight: 600;">${escapeHtml(item.artist)}</div>
        <div style="font-size: 11px; color: var(--accent-yellow); font-weight: 700; margin-top: 2px;">${escapeHtml(item.status.detail)}</div>`;
      eventsList.appendChild(card);
    });
    eventsContainer.style.display = "block";
  } else {
    eventsContainer.style.display = "none";
  }

  // Artistas
  container.innerHTML = "";
  Object.keys(artistsMap).sort().forEach(artista => {
    const details = document.createElement("details");
    details.className = "artist-details";
    details.dataset.artistName = artista.toLowerCase();
    details.style.cssText = "background: var(--bg-primary); border: 2px solid var(--accent-blue); border-radius: 14px; margin-bottom: 20px; overflow: hidden; box-shadow: var(--shadow);";

    const summary = document.createElement("summary");
    summary.style.cssText = "font-weight: 800; font-size: 18px; padding: 16px 20px; background: var(--card-bg); cursor: pointer; color: var(--text-primary); outline: none; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; gap: 10px;";
    summary.innerHTML = '<span class="artist-summary-title" style="word-break: break-word;"><i class="fa-solid fa-microphone-lines" style="margin-right: 8px; color: var(--accent-blue);"></i>' + escapeHtml(artista) + '</span>' +
      '<span class="artist-summary-badge" style="font-size: 13px; background: #2563eb; padding: 4px 12px; border-radius: 20px; color: #fff; font-weight: 700; white-space: nowrap;">' + artistsMap[artista].length + ' ' + t("releases") + '</span>';
    details.appendChild(summary);

    const artistContent = document.createElement("div");
    artistContent.style.cssText = "padding: 15px; background: var(--bg-primary);";

    // Accesos rápidos a eventos
    const evs = artistsMap[artista].filter(i => i.status.type);
    if (evs.length > 0) {
      const nav = document.createElement("div");
      nav.style.cssText = "background: var(--bg-tertiary); border: 1px dashed var(--accent-blue); border-radius: 10px; padding: 10px 12px; margin-bottom: 15px;";
      let navHtml = '<div style="font-size: 12px; color: var(--accent-blue); font-weight: 800; text-transform: uppercase; margin-bottom: 8px;"><i class="fa-solid fa-star" style="margin-right: 6px;"></i>' + t("quick_access") + '</div><div style="display: flex; flex-wrap: wrap; gap: 8px;">';
      evs.forEach(ev => {
        const ic = ev.status.type === "ANNIVERSARY" ? "fa-cake-candles" : "fa-rocket";
        navHtml += `<button onclick="scrollToRelease('${escapeHtml(artista).replace(/'/g, "\\'")}','${ev.cardId}')" style="background: ${ev.status.badgeColor}; border: 0; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer;"><i class="fa-solid ${ic}"></i> ${escapeHtml(ev.data["Título del álbum/sencillo/EP"] || "Lanzamiento")}</button>`;
      });
      navHtml += '</div>';
      nav.innerHTML = navHtml;
      artistContent.appendChild(nav);
    }

    // Tarjetas
    artistsMap[artista].forEach(item => {
      artistContent.appendChild(buildReleaseCard(item, artista, embedKeys, linkKeys));
    });

    details.appendChild(artistContent);
    container.appendChild(details);
  });
}

/* ═════════════════════════════════════════════════════════════════
   8. TARJETA DE LANZAMIENTO
   ═════════════════════════════════════════════════════════════════ */
function buildReleaseCard(item, artista, embedKeys, linkKeys) {
  const song = item.data;
  const allowed = item.allowed;
  const status = item.status;
  const explicitType = item.explicitType;

  const card = document.createElement("div");
  card.className = "release-card " + (status.animClass || "");
  card.id = item.cardId;
  card.dataset.explicit = explicitType;
  card.dataset.genre = item.genre.toLowerCase();
  card.dataset.category = item.category;
  card.dataset.status = status.type || "";
  card.dataset.date = item.date;
  card.dataset.title = (song["Título del álbum/sencillo/EP"] || "").toLowerCase();
  card.dataset.artist = artista.toLowerCase();

  const albumTitle = song["Título del álbum/sencillo/EP"] || "Lanzamiento sin título";
  const trackNames = [];
  for (let t = 1; t <= 15; t++) if (song[`Título ${t}`]) trackNames.push(song[`Título ${t}`]);

  const eventSearchTag = status.type === "ANNIVERSARY" ? "aniversario" : status.type === "FUTURE" ? "proximo futuro estreno" : "";
  card.dataset.searchKeywords = (artista + " " + albumTitle + " " + trackNames.join(" ") + " " + eventSearchTag).toLowerCase();
  card.style.cssText = "border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; margin-bottom: 20px; background: var(--bg-secondary); position: relative;";

  // Botones de acción
  const actions = document.createElement("div");
  actions.className = "release-actions";
  actions.innerHTML =
    `<button class="act-btn mic" title="${t('karaoke')}"><i class="fa-solid fa-microphone"></i></button>
     <button class="act-btn share" title="${t('share')}"><i class="fa-solid fa-share-nodes"></i></button>`;
  card.appendChild(actions);

  // Contenido
  let html = "";

  if (status.type) {
    const dotVisual = status.type === "FUTURE" ? '<span class="radar-dot"></span>' : '';
    html += `<div style="background: ${status.bgColor}; border: 1px solid ${status.borderColor}; color: var(--text-primary); padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; position: relative; z-index: 3;">
      <span>${dotVisual}<i class="fa-solid ${status.type === "ANNIVERSARY" ? "fa-cake-candles" : "fa-rocket"}" style="margin-right: 8px; color: ${status.badgeColor};"></i><strong>${escapeHtml(status.label)}:</strong> ${escapeHtml(status.detail)}</span>
      <span style="font-size: 11px; opacity: 0.8;">${escapeHtml(status.dateStr)}</span>
    </div>`;

    if (status.type === "FUTURE" && status.targetTime) {
      html += `<div class="countdown-box" data-countdown="${status.targetTime}"></div>`;
    }
  }

  html += `<div style="border-bottom: 2px solid var(--accent-blue); padding-bottom: 10px; margin-bottom: 15px; position: relative; z-index: 3;">
    <h3 style="margin: 0; color: var(--text-primary); font-size: 20px; font-weight: 800; word-break: break-word;">
      <i class="fa-solid fa-compact-disc" style="margin-right: 8px; color: var(--accent-purple);"></i>${escapeHtml(albumTitle)}${explicitBadgeHTML(explicitType)}
    </h3>
  </div>`;

  // Grid de info
  html += '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 15px; position: relative; z-index: 3;">';
  allowed.forEach(key => {
    const isTrackField = /^(Título|Artistas|Compositores|¿Contiene letras\?|Letristas|ISRC|Idioma|Preview Clip|Cover)\s\d+$/.test(key);
    const isPlatform = embedKeys.includes(key) || linkKeys.includes(key);
    if (!isTrackField && !isPlatform && song[key] !== undefined && song[key] !== "") {
      html += `<div style="background: var(--bg-tertiary); padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); word-break: break-word;">
        <strong style="color: var(--accent-yellow); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 2px;">${escapeHtml(key)}</strong>
        <span style="color: var(--text-primary); font-size: 14px; font-weight: 600;">${escapeHtml(song[key])}</span>
      </div>`;
    }
  });
  html += '</div>';

  // Plataformas (iconos)
  let linksHtml = "";
  linkKeys.forEach(key => {
    if (allowed.includes(key) && song[key]) {
      linksHtml += `<a href="${escapeHtml(song[key])}" target="_blank" class="platform-btn-icon" title="${escapeHtml(key)}"><i class="${getPlatformIcon(key)}"></i></a>`;
    }
  });

  card.innerHTML = html;
  card.appendChild(actions);

  if (linksHtml) {
    const platBox = document.createElement("div");
    platBox.style.cssText = "margin-top: 20px; background: var(--bg-tertiary); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); position: relative; z-index: 3;";
    platBox.innerHTML = `<h4 style="margin: 0 0 12px 0; color: var(--accent-blue); font-size: 15px; font-weight: 800; text-transform: uppercase;"><i class="fa-solid fa-headphones" style="margin-right: 8px;"></i>${t("platforms_title")}</h4>
      <div style="display: flex; flex-wrap: wrap; gap: 4px;">${linksHtml}</div>`;
    card.appendChild(platBox);
  }

  // Canciones
  const tracksBox = document.createElement("div");
  tracksBox.style.cssText = "margin-top: 15px; background: var(--bg-tertiary); border-radius: 12px; padding: 15px; border: 1px solid var(--border-color); position: relative; z-index: 3;";
  let tracksHtml = `<h4 style="margin-top: 0; color: var(--accent-purple); font-size: 15px; font-weight: 800; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-bottom: 12px; text-transform: uppercase;"><i class="fa-solid fa-music" style="margin-right: 8px;"></i>${t("tracks_title")}</h4>`;
  let hasTracks = false;

  for (let tr = 1; tr <= 15; tr++) {
    if (song[`Título ${tr}`]) {
      hasTracks = true;
      const hasLyrics = song[`¿Contiene letras? ${tr}`];
      const showMic = hasLyrics && String(hasLyrics).toLowerCase().includes("s");
      tracksHtml += `<div style="margin-bottom: 10px; padding: 10px 12px; background: var(--bg-secondary); border-left: 4px solid var(--accent-purple); border-radius: 0 8px 8px 0;">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;">
          <strong style="font-size: 15px; color: var(--text-primary); word-break: break-word;">${tr}. ${escapeHtml(song[`Título ${tr}`])}</strong>
          ${showMic ? `<button class="act-btn track-mic" data-track="${tr}" title="${t('karaoke')}"><i class="fa-solid fa-microphone"></i></button>` : ''}
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; font-size: 13px;">`;

      ["Artistas","Compositores","¿Contiene letras?","Letristas","ISRC","Idioma"].forEach(prop => {
        const k = `${prop} ${tr}`;
        if (allowed.includes(k) && song[k] !== undefined && song[k] !== "") {
          tracksHtml += `<div class="track-meta-box" style="background: var(--bg-tertiary); padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border-color);">
            <span style="color: var(--accent-yellow); font-weight: 700;">${escapeHtml(prop)}:</span>
            <span style="color: var(--text-primary); font-weight: 500;">${escapeHtml(song[k])}</span>
          </div>`;
        }
      });

      tracksHtml += '</div></div>';
    }
  }
  if (hasTracks) {
    tracksBox.innerHTML = tracksHtml;
    card.appendChild(tracksBox);
  }

  // Listeners
  actions.querySelector(".mic").addEventListener("click", e => {
    e.stopPropagation();
    openKaraoke(song, albumTitle, artista, 1);
  });
  actions.querySelector(".share").addEventListener("click", e => {
    e.stopPropagation();
    openSmartlink(song, albumTitle, artista, linkKeys);
  });
  card.querySelectorAll(".track-mic").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      const n = parseInt(btn.dataset.track);
      openKaraoke(song, albumTitle + " — " + song[`Título ${n}`], artista, n);
    });
  });

  return card;
}

/* ═════════════════════════════════════════════════════════════════
   9. KARAOKE MODAL
   ═════════════════════════════════════════════════════════════════ */
function openKaraoke(song, title, artist, trackNum) {
  const modal = document.getElementById("karaoke-modal");
  const lyricsBox = document.getElementById("karaoke-lyrics");
  document.getElementById("karaoke-title").textContent = title;
  document.getElementById("karaoke-artist").textContent = artist;

  // Buscar letra LRC — probamos muchas claves posibles
  const lrcKeys = [
    `Letra Sincronizada (LRC) ${trackNum}`, `Letra sincronizada (LRC) ${trackNum}`,
    `LRC ${trackNum}`, `Letra ${trackNum}`,
    "Letra Sincronizada (LRC)", "Letra sincronizada (LRC)", "LRC", "Letra"
  ];
  let lrcText = "";
  for (const k of lrcKeys) {
    if (song[k]) { lrcText = song[k]; break; }
  }

  const parsed = parseLRC(lrcText);
  AppState.karaoke.lyrics = parsed;
  AppState.karaoke.activeIdx = -1;

  if (!parsed.length) {
    lyricsBox.innerHTML = `<p class="karaoke-empty">${t("no_lyrics")}</p>`;
  } else {
    lyricsBox.innerHTML = "";
    parsed.forEach((line, i) => {
      const div = document.createElement("div");
      div.className = "lyric-line";
      div.dataset.time = line.time;
      div.dataset.idx = i;
      div.textContent = line.text || "♪";
      div.addEventListener("click", () => {
        if (AppState.ytPlayer && typeof AppState.ytPlayer.seekTo === "function") {
          AppState.ytPlayer.seekTo(line.time, true);
        }
      });
      lyricsBox.appendChild(div);
    });
  }

  modal.classList.add("open");
  modal.setAttribute("aria-hidden", "false");

  // Cargar YouTube
  const ytUrl = song["YouTube"] || song["YouTube Embed"] || "";
  const videoId = getYouTubeVideoId(ytUrl);
  initYouTubePlayer(videoId);
}

function initYouTubePlayer(videoId) {
  if (AppState.ytPlayer && AppState.ytPlayer.destroy) {
    try { AppState.ytPlayer.destroy(); } catch (e) {}
    AppState.ytPlayer = null;
  }
  AppState.ytVideoId = videoId;
  if (!videoId) return;

  const createPlayer = () => {
    AppState.ytPlayer = new YT.Player("yt-player", {
      videoId,
      playerVars: { controls: 0, disablekb: 1, modestbranding: 1, rel: 0 },
      events: {
        onReady: () => { AppState.ytReady = true; startKaraokeLoop(); },
        onStateChange: onYTStateChange
      }
    });
  };

  if (window.YT && window.YT.Player) {
    createPlayer();
  } else {
    // El callback global solo se ejecuta una vez
    window.onYouTubeIframeAPIReady = createPlayer;
  }
}

function onYTStateChange(e) {
  const btn = document.getElementById("karaoke-play-pause");
  if (!btn) return;
  if (e.data === YT.PlayerState.PLAYING) {
    btn.innerHTML = '<i class="fa-solid fa-pause"></i>';
    startKaraokeLoop();
  } else {
    btn.innerHTML = '<i class="fa-solid fa-play"></i>';
  }
}

function startKaraokeLoop() {
  if (AppState.karaoke.rafId) cancelAnimationFrame(AppState.karaoke.rafId);
  const tick = () => {
    const p = AppState.ytPlayer;
    if (p && p.getCurrentTime && p.getPlayerState) {
      const st = p.getPlayerState();
      if (st === YT.PlayerState.PLAYING) {
        updateKaraoke(p.getCurrentTime(), p.getDuration());
      }
    }
    AppState.karaoke.rafId = requestAnimationFrame(tick);
  };
  tick();
}

function updateKaraoke(time, duration) {
  const lyrics = AppState.karaoke.lyrics;
  if (!lyrics.length) return;

  let idx = -1;
  for (let i = 0; i < lyrics.length; i++) {
    if (time >= lyrics[i].time) idx = i;
    else break;
  }

  if (idx !== AppState.karaoke.activeIdx) {
    const lines = document.querySelectorAll("#karaoke-lyrics .lyric-line");
    lines.forEach(l => l.classList.remove("active"));
    if (idx >= 0 && lines[idx]) {
      lines[idx].classList.add("active");
      lines[idx].scrollIntoView({ behavior: "smooth", block: "center" });
    }
    AppState.karaoke.activeIdx = idx;
  }

  const timeEl = document.getElementById("karaoke-time");
  if (timeEl) {
    const fmt = s => {
      s = Math.max(0, Math.floor(s || 0));
      return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
    };
    timeEl.textContent = fmt(time) + " / " + fmt(duration);
  }
}

document.getElementById("karaoke-play-pause").addEventListener("click", () => {
  const p = AppState.ytPlayer;
  if (!p || !p.getPlayerState) return;
  if (p.getPlayerState() === YT.PlayerState.PLAYING) p.pauseVideo();
  else p.playVideo();
});

/* ═════════════════════════════════════════════════════════════════
   10. SMARTLINK MODAL
   ═════════════════════════════════════════════════════════════════ */
function openSmartlink(song, title, artist, linkKeys) {
  const modal = document.getElementById("smartlink-modal");
  const body = document.getElementById("smartlink-body");
  const cover = song["Cover"] || song["Cover 1"] ||
    "https://raw.githubusercontent.com/Grouvex/grouvex.github.io/refs/heads/main/priv/arch/imagen/isede/Grouvex%20Studios%20Records%20Logo.png";
  const shareUrl = `${location.origin}${location.pathname}?release=${encodeURIComponent(title)}`;

  let linksHtml = "";
  linkKeys.forEach(k => {
    if (song[k]) {
      linksHtml += `<a href="${escapeHtml(song[k])}" target="_blank" rel="noopener" class="sl-link">
        <i class="${getPlatformIcon(k)}"></i> ${escapeHtml(k)}</a>`;
    }
  });

  body.innerHTML = `
    <img class="sl-cover" src="${escapeHtml(cover)}" alt="${escapeHtml(title)}" onerror="this.src='https://raw.githubusercontent.com/Grouvex/grouvex.github.io/refs/heads/main/priv/arch/imagen/isede/Grouvex%20Studios%20Records%20Logo.png'">
    <h2 class="sl-title">${escapeHtml(title)}</h2>
    <p class="sl-artist">${escapeHtml(artist)}</p>
    <p style="font-size: 12px; color: var(--text-secondary); text-transform: uppercase; font-weight: 800;">${t("listen_on")}</p>
    <div class="sl-links">${linksHtml || '<p style="color: var(--text-secondary);">—</p>'}</div>
    <button class="sl-copy" id="sl-copy-btn"><i class="fa-solid fa-link"></i> ${t("copy_link")}</button>`;

  document.getElementById("sl-copy-btn").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(shareUrl);
      const btn = document.getElementById("sl-copy-btn");
      btn.innerHTML = `<i class="fa-solid fa-check"></i> ${t("copied")}`;
      setTimeout(() => { btn.innerHTML = `<i class="fa-solid fa-link"></i> ${t("copy_link")}`; }, 2000);
    } catch (e) { alert(shareUrl); }
  });

  modal.classList.add("open");
  modal.setAttribute("aria-hidden", "false");
}

/* ═════════════════════════════════════════════════════════════════
   11. CIERRE DE MODALES
   ═════════════════════════════════════════════════════════════════ */
document.addEventListener("click", e => {
  if (e.target.classList.contains("modal-overlay")) closeModal(e.target.id);
  if (e.target.closest("[data-close]")) closeModal(e.target.closest("[data-close]").dataset.close);
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    document.querySelectorAll(".modal-overlay.open").forEach(m => closeModal(m.id));
  }
});

function closeModal(id) {
  const modal = document.getElementById(id);
  if (!modal) return;
  modal.classList.remove("open");
  modal.setAttribute("aria-hidden", "true");
  if (id === "karaoke-modal") {
    if (AppState.karaoke.rafId) cancelAnimationFrame(AppState.karaoke.rafId);
    AppState.karaoke.rafId = null;
    if (AppState.ytPlayer && AppState.ytPlayer.pauseVideo) {
      try { AppState.ytPlayer.pauseVideo(); } catch (e) {}
    }
  }
}

/* ═════════════════════════════════════════════════════════════════
   12. CONTROLES (filtros, vista, orden, explicit)
   ═════════════════════════════════════════════════════════════════ */
function setupControls() {
  document.getElementById("sort-select").addEventListener("change", e => {
    AppState.sortBy = e.target.value;
    applyFilters();
  });

  document.querySelectorAll(".view-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".view-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      AppState.viewMode = btn.dataset.view;
      document.getElementById("catalog-container").classList.toggle("grid-view", AppState.viewMode === "grid");
    });
  });

  document.getElementById("explicit-toggle").addEventListener("change", e => {
    AppState.hideExplicit = e.target.checked;
    applyFilters();
  });

  document.querySelectorAll("[data-filter-cat]").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("[data-filter-cat]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      AppState.filterCat = btn.dataset.filterCat;
      applyFilters();
    });
  });

  document.querySelectorAll("[data-filter-status]").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("[data-filter-status]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      AppState.filterStatus = btn.dataset.filterStatus;
      applyFilters();
    });
  });

  document.querySelectorAll("[data-filter-explicit]").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("[data-filter-explicit]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      AppState.filterExplicit = btn.dataset.filterExplicit;
      applyFilters();
    });
  });

  document.getElementById("chips-genre").addEventListener("click", e => {
    if (!e.target.matches("[data-filter-genre]")) return;
    document.querySelectorAll("[data-filter-genre]").forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
    AppState.filterGenre = e.target.dataset.filterGenre;
    applyFilters();
  });
}

function applyFilters() {
  const query = (document.getElementById("global-search-input").value || "").toLowerCase().trim();
  const artistBlocks = document.querySelectorAll(".artist-details");

  artistBlocks.forEach(details => {
    let visibleCount = 0;
    details.querySelectorAll(".release-card").forEach(card => {
      let show = true;

      // Búsqueda
      if (query && !card.dataset.searchKeywords.includes(query)) show = false;

      // Ocultar explícito (switch)
      if (show && AppState.hideExplicit && card.dataset.explicit === "explicit") show = false;

      // Filtro por tipo de contenido
      if (show && AppState.filterExplicit !== "all") {
        if (card.dataset.explicit !== AppState.filterExplicit) show = false;
      }

      // Categoría
      if (show && AppState.filterCat !== "all") {
        const cat = card.dataset.category;
        const f = AppState.filterCat.toLowerCase();
        if (f === "album" && !(cat.includes("album") || cat.includes("álbum"))) show = false;
        else if (f !== "album" && !cat.includes(f)) show = false;
      }

      // Estado
      if (show && AppState.filterStatus !== "all") {
        if (card.dataset.status !== AppState.filterStatus) show = false;
      }

      // Género
      if (show && AppState.filterGenre !== "all") {
        if (!card.dataset.genre.includes(AppState.filterGenre.toLowerCase())) show = false;
      }

      card.style.display = show ? "" : "none";
      if (show) visibleCount++;
    });

    details.style.display = visibleCount ? "" : "none";
    if (query && visibleCount) details.open = true;
  });

  applySort();
}

function applySort() {
  const container = document.getElementById("catalog-container");
  const artistBlocks = [...container.querySelectorAll(".artist-details")];
  const sort = AppState.sortBy;

  if (sort === "artist" || sort === "az" || sort === "za") {
    artistBlocks.sort((a, b) => {
      const na = a.dataset.artistName, nb = b.dataset.artistName;
      return sort === "za" ? nb.localeCompare(na) : na.localeCompare(nb);
    });
    artistBlocks.forEach(b => container.appendChild(b));
  }

  artistBlocks.forEach(block => {
    const cards = [...block.querySelectorAll(".release-card")];
    cards.sort((a, b) => {
      if (sort === "recent") return (parseInt(b.dataset.date) || 0) - (parseInt(a.dataset.date) || 0);
      if (sort === "az") return a.dataset.title.localeCompare(b.dataset.title);
      if (sort === "za") return b.dataset.title.localeCompare(a.dataset.title);
      return 0;
    });
    cards.forEach(c => c.parentNode && c.parentNode.appendChild(c));
  });
}

function filterCatalog() { applyFilters(); }

/* ═════════════════════════════════════════════════════════════════
   13. SCROLL A LANZAMIENTO
   ═════════════════════════════════════════════════════════════════ */
function scrollToRelease(artistName, releaseId) {
  document.querySelectorAll(".artist-details").forEach(details => {
    if (details.dataset.artistName === artistName.toLowerCase()) {
      details.open = true;
      const target = document.getElementById(releaseId);
      if (target) {
        target.scrollIntoView({ behavior: "smooth", block: "center" });
        target.style.outline = "2px solid #38bdf8";
        setTimeout(() => { target.style.outline = "none"; }, 2500);
      }
    }
  });
}

/* ═════════════════════════════════════════════════════════════════
   14. COUNTDOWN EN TIEMPO REAL
   ═════════════════════════════════════════════════════════════════ */
setInterval(() => {
  document.querySelectorAll("[data-countdown]").forEach(el => {
    const target = parseInt(el.dataset.countdown, 10);
    const diff = target - Date.now();
    if (diff <= 0) {
      el.innerHTML = `<span style="color: var(--accent-yellow); font-weight: 800; font-size: 14px;">🎉 ${t("available_now")}</span>`;
      return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    el.innerHTML = `
      <div class="countdown-seg"><span class="countdown-num">${String(d).padStart(2, "0")}</span><span class="countdown-lbl">${t("day")}</span></div>
      <div class="countdown-seg"><span class="countdown-num">${String(h).padStart(2, "0")}</span><span class="countdown-lbl">${t("hour")}</span></div>
      <div class="countdown-seg"><span class="countdown-num">${String(m).padStart(2, "0")}</span><span class="countdown-lbl">${t("min")}</span></div>
      <div class="countdown-seg"><span class="countdown-num">${String(s).padStart(2, "0")}</span><span class="countdown-lbl">${t("sec")}</span></div>`;
  });
}, 1000);
