<!-- BLOQUE DE SCRIPT -->
<script>
  document.addEventListener("DOMContentLoaded", function() {
    google.script.run
      .withSuccessHandler(renderCatalog)
      .withFailureHandler(handleError)
      .getAllSongs();
  });

  function handleError(error) {
    var loadingDiv = document.getElementById("loading");
    if (loadingDiv) {
      loadingDiv.innerHTML = '<p style="color: #ff6b6b; font-weight: bold; font-size: 16px;">⚠️ Error al cargar el catálogo: ' + error.message + '</p>';
    }
  }

  function getPlatformIcon(platform) {
    var icons = {
      "Spotify": "fa-brands fa-spotify",
      "YouTube": "fa-brands fa-youtube",
      "Apple Music": "fa-brands fa-apple",
      "Amazon Music": "fa-brands fa-amazon",
      "Deezer": "fa-brands fa-deezer",
      "Tidal": "fa-solid fa-compact-disc",
      "Instagram": "fa-brands fa-instagram",
      "TikTok": "fa-brands fa-tiktok",
      "SoundCloud": "fa-brands fa-soundcloud"
    };
    return icons[platform] || "fa-solid fa-link";
  }

  function formatEmbedContent(embedData) {
    if (!embedData) return '';
    var str = String(embedData).trim();
    
    if (str.toLowerCase().includes("<iframe")) {
      return str;
    }

    if (str.startsWith("http://") || str.startsWith("https://")) {
      var srcUrl = str;
      
      if (srcUrl.includes("youtube.com/watch?v=")) {
        srcUrl = srcUrl.replace("watch?v=", "embed/");
      } else if (srcUrl.includes("youtu.be/")) {
        srcUrl = srcUrl.replace("youtu.be/", "youtube.com/embed/");
      }

      return '<iframe src="' + escapeHtml(srcUrl) + '" height="180" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>';
    }

    return str;
  }

  function renderCatalog(response) {
    var loadingDiv = document.getElementById("loading");
    var container = document.getElementById("catalog-container");
    var searchBar = document.getElementById("search-bar-container");

    if (response.error || !response.songsData || response.songsData.length === 0) {
      loadingDiv.innerHTML = '<p style="color: #ffffff; font-size: 16px;">No se encontraron lanzamientos disponibles.</p>';
      return;
    }

    var forbiddenFields = [
      "Grouvex Studios UserID", 
      "Marca temporal", 
      "Estado del Contrato", 
      "Razón", 
      "¿Se Puede Modificar el Lanzamiento?"
    ];

    var defaultFields = [
      "Artista", "Título del álbum/sencillo/EP", "Idioma del álbum", "Versión del Lanzamiento", "Cover?", 
      "Álbum Recopilatorio", "Otros Artistas Álbum", "Compositores del álbum", "Letristas del álbum", 
      "Información para colaboradores", "Género primario", "Género secundario", "Derechos de autor de la composición", 
      "Derechos de autor de grabación de sonido", "Nombre del sello discográfico", "Lanzamiento original", 
      "Fecha de pedido anticipado", "Fecha de inicio de ventas", "Agregar una hora", "Elegir zona horaria | Agregar una hora", 
      "Entrar en vivo | Agregar una hora", "Explicit Content", "Plataformas de Lanzamiento", "Spotify", "Spotify Embed", 
      "YouTube", "YouTube Embed", "Apple Music", "Apple Music Embed", "Amazon Music", "Amazon Music Embed", 
      "Deezer", "Deezer Embed", "Tidal", "Instagram", "TikTok", "SoundCloud", "Territorios donde:", 
      "Territorios:", "Likes", "Categoría del Lanzamiento"
    ];

    for (var i = 1; i <= 15; i++) {
      defaultFields.push("Título " + i, "Artistas " + i, "Compositores " + i, "¿Contiene letras? " + i, "Letristas " + i, "Idioma " + i, "Preview Clip " + i, "Cover " + i);
    }

    var embedKeys = ["Spotify Embed", "YouTube Embed", "Apple Music Embed", "Amazon Music Embed", "Deezer Embed"];
    var linkKeys = ["Spotify", "YouTube", "Apple Music", "Amazon Music", "Deezer", "Tidal", "Instagram", "TikTok", "SoundCloud"];

    var artistsMap = {};

    response.songsData.forEach(function(song) {
      var privacidadVal = (song["Mostrar Privacidad"] || song["Privacidad"] || "").toString().trim();

      if (privacidadVal.toLowerCase() === "privado") return;

      var allowedFields = [];
      if (privacidadVal.toLowerCase() === "público" || privacidadVal.toLowerCase() === "publico" || privacidadVal === "") {
        allowedFields = defaultFields;
      } else {
        allowedFields = privacidadVal.split(",").map(function(s) { return s.trim(); });
      }

      allowedFields = allowedFields.filter(function(field) {
        return !forbiddenFields.includes(field);
      });

      var artistaName = song["Artista"] || "Artista Desconocido";

      if (!artistsMap[artistaName]) {
        artistsMap[artistaName] = [];
      }
      artistsMap[artistaName].push({ data: song, allowed: allowedFields });
    });

    container.innerHTML = "";

    Object.keys(artistsMap).forEach(function(artista) {
      var details = document.createElement("details");
      details.className = "artist-details";
      details.dataset.artistName = artista.toLowerCase();
      details.style.cssText = "background-color: #0f172a; border: 2px solid #3b82f6; border-radius: 14px; margin-bottom: 20px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); overflow: hidden;";

      var summary = document.createElement("summary");
      summary.style.cssText = "font-weight: 800; font-size: 18px; padding: 16px 20px; background: #1e293b; cursor: pointer; color: #ffffff; outline: none; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; gap: 10px;";
      summary.innerHTML = '<span class="artist-summary-title" style="color:#ffffff; word-break: break-word;"><i class="fa-solid fa-microphone-lines" style="margin-right:8px; color:#38bdf8;"></i>' + escapeHtml(artista) + '</span><span class="artist-summary-badge" style="font-size: 13px; background: #2563eb; padding: 4px 12px; border-radius: 20px; color: #ffffff; font-weight:700; white-space: nowrap;">' + artistsMap[artista].length + ' Lanzamientos</span>';
      details.appendChild(summary);

      var artistContent = document.createElement("div");
      artistContent.style.cssText = "padding: 15px; background-color: #0f172a;";

      artistsMap[artista].forEach(function(item) {
        var song = item.data;
        var allowed = item.allowed;

        var releaseCard = document.createElement("div");
        releaseCard.className = "release-card";
        
        var albumTitle = song["Título del álbum/sencillo/EP"] || "Lanzamiento sin título";
        var trackNames = [];
        for (var t = 1; t <= 15; t++) {
          if (song["Título " + t]) trackNames.push(song["Título " + t]);
        }
        releaseCard.dataset.searchKeywords = (artista + " " + albumTitle + " " + trackNames.join(" ")).toLowerCase();

        releaseCard.style.cssText = "border: 1px solid #334155; border-radius: 12px; padding: 15px; margin-bottom: 20px; background: #182234; box-sizing: border-box;";

        // --- INFORMACIÓN DEL ÁLBUM (GRID RESPONSIVO) ---
        var htmlAlbum = '<div style="border-bottom: 2px solid #38bdf8; padding-bottom: 10px; margin-bottom: 15px;">' +
                          '<h3 style="margin:0; color:#ffffff; font-size:20px; font-weight:800; word-break: break-word;"><i class="fa-solid fa-compact-disc" style="margin-right:8px; color:#c084fc;"></i>' + escapeHtml(albumTitle) + '</h3>' +
                        '</div>';
        
        htmlAlbum += '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 15px;">';
        
        allowed.forEach(function(key) {
          var isTrackField = /^(Título|Artistas|Compositores|¿Contiene letras\?|Letristas|ISRC|Idioma|Preview Clip|Cover)\s\d+$/.test(key);
          var isPlatform = embedKeys.includes(key) || linkKeys.includes(key);

          if (!isTrackField && !isPlatform && song[key] !== undefined && song[key] !== "") {
            htmlAlbum += '<div style="background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #334155; word-break: break-word;">' +
                          '<strong style="color: #fde047; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 2px;">' + escapeHtml(key) + '</strong>' +
                          '<span style="color: #ffffff; font-size: 14px; font-weight: 600;">' + escapeHtml(song[key]) + '</span>' +
                         '</div>';
          }
        });
        htmlAlbum += '</div>';

        // --- PLATAFORMAS (BOTONES ICONOS, HR Y UN SOLO IFRAME VISIBLE) ---
        var embedsHtml = '';
        var linksHtml = '';

        linkKeys.forEach(function(key) {
          if (allowed.includes(key) && song[key]) {
            var iconClass = getPlatformIcon(key);
            linksHtml += '<a href="' + escapeHtml(song[key]) + '" target="_blank" class="platform-btn" style="display:inline-flex; align-items:center; gap:8px; background: #2563eb; color:#ffffff; padding: 8px 14px; margin: 3px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: 700; border: 1px solid #60a5fa; box-shadow: 0 4px 10px rgba(37,99,235,0.3);">' +
                            '<i class="' + iconClass + '" style="font-size:15px;"></i> ' + escapeHtml(key) + ' <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:9px; margin-left:2px;"></i>' +
                         '</a>';
          }
        });

        embedKeys.forEach(function(key) {
          if (allowed.includes(key) && song[key]) {
            var iframeContent = formatEmbedContent(song[key]);
            embedsHtml += '<div style="flex: 0 0 100%; width: 100%; min-width: 100%; scroll-snap-align: start; box-sizing: border-box; background: #0f172a; padding: 12px; border-radius: 12px; border: 1px solid #38bdf8;">' +
                            '<div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">' +
                              '<i class="' + getPlatformIcon(key.replace(" Embed", "")) + '" style="color:#38bdf8; font-size:16px;"></i>' +
                              '<strong style="font-size: 13px; color: #ffffff; text-transform: uppercase; font-weight:700;">' + escapeHtml(key) + '</strong>' +
                            '</div>' +
                            '<div class="embed-wrapper" style="border-radius:8px; overflow:hidden; background:#000;">' + iframeContent + '</div>' +
                          '</div>';
          }
        });

        if (linksHtml || embedsHtml) {
          htmlAlbum += '<div style="margin-top: 20px; background: #0b1120; padding: 15px; border-radius: 12px; border: 1px solid #1e293b; box-sizing: border-box;">';
          htmlAlbum += '<h4 style="margin:0 0 12px 0; color:#38bdf8; font-size:15px; font-weight:800; text-transform:uppercase;"><i class="fa-solid fa-headphones" style="margin-right:8px;"></i>Plataformas y Reproductores</h4>';
          
          if (linksHtml) {
            htmlAlbum += '<div style="margin-bottom: 10px; display:flex; flex-wrap:wrap; gap:4px;">' + linksHtml + '</div>';
          }

          if (linksHtml && embedsHtml) {
            htmlAlbum += '<hr style="border: 0; height: 1px; background: linear-gradient(90deg, rgba(56, 189, 248, 0.1), rgba(56, 189, 248, 0.8), rgba(56, 189, 248, 0.1)); margin: 15px 0;">';
          }

          if (embedsHtml) {
            htmlAlbum += '<div style="position:relative; width: 100%; overflow: hidden;">' +
                           '<div class="custom-scroll" style="display: flex; overflow-x: auto; scroll-snap-type: x mandatory; width: 100%; gap: 0px; padding-bottom: 10px; box-sizing: border-box;">' + embedsHtml + '</div>' +
                           '<p style="text-align:right; font-size:11px; color:#94a3b8; margin:4px 0 0 0;"><i class="fa-solid fa-arrows-left-right" style="margin-right:4px;"></i> Desliza para ver otros reproductores</p>' +
                         '</div>';
          }
          htmlAlbum += '</div>';
        }

        releaseCard.innerHTML = htmlAlbum;

        // --- CANCIONES DEL ÁLBUM (1 a 15) ---
        var tracksContainer = document.createElement("div");
        tracksContainer.style.cssText = "margin-top: 15px; background: #0b1120; border-radius: 12px; padding: 15px; border: 1px solid #1e293b; box-sizing: border-box;";
        
        var tracksHtml = '<h4 style="margin-top:0; color:#c084fc; font-size:15px; font-weight:800; border-bottom:1px solid #334155; padding-bottom:8px; margin-bottom:12px; text-transform:uppercase;"><i class="fa-solid fa-music" style="margin-right:8px;"></i>Lista de Canciones</h4>';
        var hasTracks = false;

        for (var t = 1; t <= 15; t++) {
          var trackTitleKey = "Título " + t;
          
          if (song[trackTitleKey]) {
            hasTracks = true;
            tracksHtml += '<div style="margin-bottom: 10px; padding: 10px 12px; background: #182234; border-left: 4px solid #a855f7; border-radius: 0 8px 8px 0; box-sizing: border-box;">';
            tracksHtml += '<div style="display:flex; align-items:center;"><strong style="font-size:15px; color:#ffffff; word-break: break-word;">' + t + '. ' + escapeHtml(song[trackTitleKey]) + '</strong></div>';
            tracksHtml += '<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; font-size: 13px;">';

            var trackProperties = [
              "Artistas", "Compositores", "¿Contiene letras?", "Letristas", "ISRC", "Idioma", "Preview Clip", "Cover"
            ];

            trackProperties.forEach(function(prop) {
              var fullKey = prop + " " + t;
              if (allowed.includes(fullKey) && song[fullKey] !== undefined && song[fullKey] !== "") {
                tracksHtml += '<div class="track-meta-box" style="background: #0f172a; padding: 5px 10px; border-radius: 6px; border: 1px solid #334155; word-break: break-word;">' +
                                '<span style="color:#fde047; font-weight:700;">' + escapeHtml(prop) + ':</span> ' +
                                '<span style="color:#ffffff; font-weight:500;">' + escapeHtml(song[fullKey]) + '</span>' +
                              '</div>';
              }
            });

            tracksHtml += '</div></div>';
          }
        }

        if (hasTracks) {
          tracksContainer.innerHTML = tracksHtml;
          releaseCard.appendChild(tracksContainer);
        }

        artistContent.appendChild(releaseCard);
      });

      details.appendChild(artistContent);
      container.appendChild(details);
    });

    loadingDiv.style.display = "none";
    searchBar.style.display = "block";
    container.style.display = "block";
  }

  function filterCatalog() {
    var query = document.getElementById("global-search-input").value.toLowerCase().trim();
    var artistBlocks = document.querySelectorAll(".artist-details");

    artistBlocks.forEach(function(details) {
      var artistName = details.dataset.artistName;
      var releases = details.querySelectorAll(".release-card");
      var hasVisibleRelease = false;

      releases.forEach(function(card) {
        var keywords = card.dataset.searchKeywords;
        
        if (query === "" || keywords.includes(query)) {
          card.style.display = "block";
          hasVisibleRelease = true;
        } else {
          card.style.display = "none";
        }
      });

      if (hasVisibleRelease) {
        details.style.display = "block";
        if (query !== "") {
          details.open = true;
        }
      } else {
        details.style.display = "none";
      }
    });
  }

  function escapeHtml(text) {
    if (text === null || text === undefined) return '';
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }
</script>
